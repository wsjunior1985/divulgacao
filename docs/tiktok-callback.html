<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>TikTok — callback OAuth</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; }
  code { background: #f0f0f0; padding: 0.5rem; display: block; word-break: break-all; margin: 1rem 0; }
  .erro { color: #b00020; }
</style>
</head>
<body>
  <h1>Callback do TikTok</h1>
  <p>Copie o valor abaixo e cole de volta na conversa com o Claude.</p>
  <div id="saida">Lendo a URL…</div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const error = params.get("error");
    const errorDescription = params.get("error_description");
    const saida = document.getElementById("saida");
    if (code) {
      saida.innerHTML = "<strong>code:</strong><code>" + code + "</code>";
    } else if (error) {
      saida.innerHTML = "<p class='erro'><strong>Erro:</strong> " + error + "</p><p>" + (errorDescription || "") + "</p>";
    } else {
      saida.textContent = "Nenhum parâmetro encontrado na URL.";
    }
  </script>
</body>
</html>
