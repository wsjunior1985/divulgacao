name: publicar-video

# Reels do rodízio de vídeos (2 por dia, 12h e 19h BRT). Disparo pontual pela VPS
# (/etc/cron.d/divulgacao-slots, scripts/vps/): o schedule nativo do GitHub atrasa 5-7h.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Mostrar o vídeo e as legendas do slot sem publicar"
        type: boolean
        default: true
      cron:
        description: "Cron do slot (disparo pela VPS). Ex.: 0 15 * * *"
        type: string
        required: false
      data:
        description: "Data do slot (AAAA-MM-DD), para teste ou recuperação. Vazio = pelo cron"
        type: string
        required: false
      pos:
        description: "Posição do slot no dia: 0 = 12h BRT, 1 = 19h BRT (usar com data)"
        type: string
        required: false
      permitir_atraso:
        description: "Recuperar slot que já passou (ignora o limite de 120 min)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      META_APP_ID: ${{ secrets.META_APP_ID }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GITHUB_EVENT_SCHEDULE: ${{ inputs.cron }}
      PERMITIR_ATRASO: ${{ inputs.permitir_atraso }}
      SLOT_DATA: ${{ inputs.data }}
      SLOT_POS: ${{ inputs.pos }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Publicar o vídeo do slot
        run: |
          argumentos=()
          if [ "${{ inputs.dry_run }}" = "true" ]; then argumentos+=(--dry-run); fi
          if [ -n "$SLOT_DATA" ]; then argumentos+=(--data "$SLOT_DATA" --pos "${SLOT_POS:-0}"); fi
          node scripts/publicar-video-rodizio.mjs "${argumentos[@]}"
      - name: Registrar resultado
        if: ${{ always() && inputs.dry_run != true }}
        run: |
          git config user.name "divulgacao-bot"
          git config user.email "divulgacao-bot@users.noreply.github.com"
          git add estado/videos-rodizio.json || true
          git diff --cached --quiet || git commit -m "chore: registro de reel [skip ci]"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
