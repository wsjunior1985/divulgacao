name: publicar

# Publica um post por horário agendado. O rodízio de app e tema é calculado a
# partir da data, então não existe fila para reabastecer: o conteúdo nunca acaba.
on:
  schedule:
    # Horário de Brasília = UTC-3. Mantenha em sincronia com a variável HORARIOS.
    - cron: "0 13 * * *" # 10:00 BRT
    - cron: "0 21 * * *" # 18:00 BRT
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (não publica, só mostra)"
        type: boolean
        default: true
      canais:
        description: "Canais (vazio = todos). Ex.: bluesky,threads"
        type: string
        required: false
      slot:
        description: "Slot específico (vazio = o de agora)"
        type: string
        required: false

# Necessário para commitar os cards, que viram a URL pública das imagens.
permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      META_APP_ID: ${{ secrets.META_APP_ID }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
      TIKTOK_PRIVACY: ${{ vars.TIKTOK_PRIVACY || 'SELF_ONLY' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MEDIA_MODE: ${{ vars.MEDIA_MODE || 'git' }}
      HORARIOS: ${{ vars.HORARIOS || '10,18' }}
      CANAIS: ${{ vars.CANAIS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Publicar
        run: |
          argumentos=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then argumentos="$argumentos --dry-run"; fi
          if [ -n "${{ inputs.canais }}" ]; then argumentos="$argumentos --canais ${{ inputs.canais }}"; fi
          if [ -n "${{ inputs.slot }}" ]; then argumentos="$argumentos --slot ${{ inputs.slot }}"; fi
          node scripts/publicar.mjs $argumentos

      - name: Guardar o registro do que foi publicado
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "divulgacao-bot"
          git config user.email "divulgacao-bot@users.noreply.github.com"
          git add estado/publicados.json assets/cards || true
          git diff --cached --quiet || git commit -m "chore: registro de publicação [skip ci]"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }}
